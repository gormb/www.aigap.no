<!doctype html><html lang=en><head><meta charset=utf-8><title>QR · code analysis</title>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="_qrmetrics.js"></script>
<style>
body{font:13px/1.4 system-ui,sans-serif;margin:16px;background:#eef1f4}
h1{font-size:18px;margin:0 0 2px}
#meta{color:#555;margin:4px 0 8px;word-break:break-all}
#box{display:flex;flex-wrap:wrap;gap:10px}
.tpl{display:inline-block;text-align:center;margin:4px;cursor:pointer}
.tpl .q{position:relative;display:inline-block}
.tpl .q canvas{display:block;background:#fff;border:1px solid #ddd;border-radius:4px}
.tpl .q img.art{position:absolute;object-fit:cover}
.tpl.g .q canvas{border-color:#2c8c3c}
.tpl.y .q canvas{border-color:#e0b400}
.tpl.r .q canvas{border-color:#c33}
.tpl .sz{display:block;font-size:9px;color:#888;margin-bottom:2px}
.tpl i{display:block;font-style:normal;font-size:10px;color:#444;margin-top:2px}
.tpl .er{font-size:9px;color:#666;margin-top:1px}
.tpl.r{display:none}
.tpl.dup{display:none}
body.showred .tpl.r{display:inline-block}
body.showred .tpl.dup{display:inline-block}
.legend{font-size:11px;margin:6px 0 10px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 12px;vertical-align:-1px}
.dot.g{background:#2c8c3c}.dot.y{background:#e0b400}.dot.r{background:#c33}
button{margin-left:6px;padding:3px 10px;border:1px solid #999;border-radius:6px;background:#fff;cursor:pointer}
</style></head><body>
<h1>QR analysis</h1><div id=meta></div>
<div class=legend><span class="dot g"></span>safe (&le;EC/2 damaged)&nbsp;<span class="dot y"></span>near limit (&le;EC, erasure-only)&nbsp;<span class="dot r"></span>over EC
<button id=showred>Show hidden</button></div>
<div id=box></div>
<script>
var x=(new URLSearchParams(location.search).get('x')||'').trim();
var ART=null;
function loadArt(u){return new Promise(function(res){var im=new Image();im.onload=function(){res(im)};im.onerror=function(){res(null)};im.src=u;});}
var SIZ=[21,25,29],EC=['L','M','Q','H'],HOLES=[0,3,5,7,9];
var EB={L:7,M:15,Q:25,H:30};                       // EC error budget (% codewords)
var CAP={21:{L:17,M:14,Q:11,H:7},25:{L:32,M:26,Q:20,H:18},29:{L:53,M:42,Q:34,H:27}};
var box=document.getElementById('box'),meta=document.getElementById('meta');
function contentFor(N){return (N===21?'www.aigap.no/':'https://aigap.no/')+x;}
function artStyle(N,h){var lo=((N-h)/2)|0;return 'left:'+(lo*100/N).toFixed(2)+'%;top:'+(lo*100/N).toFixed(2)+'%;width:'+(h*100/N).toFixed(2)+'%;height:'+(h*100/N).toFixed(2)+'%;';}
function matrixFor(N,ec){
  var qr=qrcode((N-17)/4, ec); qr.addData(contentFor(N),'Byte'); qr.make();
  var n=qr.getModuleCount(),M=[];
  for(var r=0;r<n;r++){var row=[];for(var c=0;c<n;c++)row.push(qr.isDark(r,c));M.push(row);}
  return M;
}
function draw(M,hole){
  var N=M.length, S=5, cv=document.createElement('canvas'); cv.width=cv.height=N*S;
  var g=cv.getContext('2d'); g.fillStyle='#fff';g.fillRect(0,0,cv.width,cv.height);
  g.fillStyle='#000';
  var lo=0;
  if(hole){lo=(N-hole)>>1;for(var y=lo;y<lo+hole;y++)for(var xx=lo;xx<lo+hole;xx++)M[y][xx]=false;}
  for(var y=0;y<N;y++)for(var xx=0;xx<N;xx++)if(M[y][xx])g.fillRect(xx*S,y*S,S,S);
  if(hole&&ART&&ART.naturalWidth){var p=lo*S,size=hole*S,aW=ART.naturalWidth,aH=ART.naturalHeight;
    if(aW>aH){var s=aH,dx=(aW-s)/2;g.drawImage(ART,dx,0,s,aH,p,p,size,size);}
    else{var sy=(aH-aW)/2;g.drawImage(ART,0,sy,aW,aW,p,p,size,size);}}
  return cv;
}
function pngSize(cv){return new Promise(function(res){cv.toBlob(function(b){res(b?b.size:null);},'image/png');});}
document.getElementById('showred').onclick=function(){var s=document.body.classList.toggle('showred');this.textContent=s?'Hide extra':'Show hidden';};
if(!x){meta.textContent='No ?x=<id>. e.g. qrgX.html?x=bgda';}
else{(async function(){
  var https='https://aigap.no/'+x, www='www.aigap.no/'+x;
  meta.innerHTML='<b>'+x+'</b> &mdash; www: '+www+' &middot; https: '+https;
  ART=await loadArt('../'+x+'.png');
  var tiles=[];
  for(var N of SIZ){for(var ec of EC){
    try{ matrixFor(N,ec); }catch(e){ continue; }     // payload too big for this size+EC
    for(var h of HOLES){
      var q=qrHoleErase(N,ec,h);            // real codeword erasure (ISO standard layout)
      var cv=draw(matrixFor(N,ec),h);       // fresh matrix per hole
      tiles.push({col:q.col,N:N,ec:ec,h:h,cv:cv,erased:q.erased,ecPer:q.ecPer,
        title:contentFor(N)+' | erases '+q.erased+' of '+q.ecPer+' EC codewords'});
    }
  }}
  var frag='';
  for(var t of tiles){
    frag+='<span class="tpl '+t.col+'" data-size="'+t.N+'" data-ec="'+t.ec+'" data-hole="'+t.h+'">'
      +'<span class=sz></span><span class="q"><canvas></canvas></span>'
      +'<i>'+t.N+' '+t.ec+' '+t.h+'</i>'
      +'<div class=er></div></span>';
  }
  box.innerHTML=frag||'<div class=legend>No combos fit this id.</div>';
  box.querySelectorAll('.tpl').forEach(function(el,i){var cn=el.querySelector('canvas'),g=cn.getContext('2d');
    cn.width=tiles[i].cv.width;cn.height=tiles[i].cv.height;g.drawImage(tiles[i].cv,0,0);});
  [].slice.call(box.querySelectorAll('.tpl')).forEach(function(el,i){var t=tiles[i];
    el.querySelector('.er').textContent='erases '+t.erased+'/'+t.ecPer+' EC cw · fixes '+((t.ecPer/2)|0);});
  dedup();loadSizes();
})();}
function colorOf(t){return t.classList.contains('g')?'g':(t.classList.contains('y')?'y':(t.classList.contains('r')?'r':null));}
function dedup(){var ECr={L:0,M:1,Q:2,H:3},rep={};
  [].slice.call(document.querySelectorAll('#box .tpl')).forEach(function(t){var col=colorOf(t);if(!col)return;
    var k=t.dataset.size+'-'+col,s=+t.dataset.hole*10+(ECr[t.dataset.ec]||0);
    if(!(k in rep)||s>rep[k].s)rep[k]={t:t,s:s};});
  [].slice.call(document.querySelectorAll('#box .tpl')).forEach(function(t){var col=colorOf(t);if(!col)return;
    var k=t.dataset.size+'-'+col; if(!(k in rep)||rep[k].t!==t)t.classList.add('dup');});}
function loadSizes(){ // real 1-bit indexed PNG byte size of the clean code (art/overlay excluded)
  [].slice.call(document.querySelectorAll('#box .tpl')).forEach(function(t){
    var N=+t.dataset.size, ec=t.dataset.ec, h=+t.dataset.hole, M;
    try{ M=matrixFor(N,ec); }catch(e){ return; }
    var lo=(N-h)>>1, hi=lo+h;
    palettePngBytes(N,h,function(y,x){return (y>=lo&&y<hi&&x>=lo&&x<hi)?false:M[y][x];}).then(function(sz){
      var el=t.querySelector('.sz'); if(el)el.textContent=sz+' B';});
  });}
</script></body></html>

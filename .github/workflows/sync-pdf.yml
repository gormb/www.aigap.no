name: Sync Books from Google (auto-deploy)

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install PDF text extraction lib
        run: pip install --quiet pymupdf pillow

      - name: Sync all books from the `books` table
        run: python3 .github/scripts/sync-books.py

      - name: Commit & Push if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 'b/**/*.pdf' 'b/**/*.md' 'b/**/*.json' 'm.md'

          if git diff --staged --quiet; then
            echo "No book updates from Google."
            exit 0
          fi

          git commit -m "auto: sync books from Google (books-tabellen) [skip ci]"

          # main is shared with the developer's own pushes, so its tip can move
          # between the commit above and the push below. Rebase onto the new tip
          # and retry instead of failing the run and losing the sync work.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main; then
              if git push origin main; then
                echo "Pushed the book sync on attempt $attempt."
                exit 0
              fi
            else
              git rebase --abort || true
            fi
            echo "::warning::Attempt $attempt to push the book sync failed; retrying"
            sleep $((attempt * 5))
          done

          echo "::error::Could not push the synced books after 5 attempts."
          exit 1

      - name: Purge stale word-map cache (Supabase public.map)
        run: python3 .github/scripts/cache.py

      - name: Fail if any book sync error (so you get notified)
        run: |
          if [ -f .sync-books-errors ]; then
            echo "::error::Books sync or aigap.no/m.md publish reported errors – see annotations in the 'Sync all books' step. Valid updates were still committed."
            exit 1
          fi

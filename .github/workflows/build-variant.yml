name: Build book variant (md + pdf)

# Bygger en variant av en bok fra kapitlene i public.book_chapter:
#   b/<book>/<variant>/<variant>.pdf               spredningen leseren åpner
#   b/<book>/<variant>/<variant>_<LANG>_<TIER>.*   de fire utgavene (.md + .pdf)
#   b/<book>/<variant>/<variant>.jpg               plakaten
# Dispatches fra «Create»-knappen i adm (book_variant-tabellen).
on:
  workflow_dispatch:
    inputs:
      book:
        description: 'book (mappe under b/, f.eks. LifeDemandedDeath)'
        required: true
      variant:
        description: 'variant (public.book_variant.variant, f.eks. LddSignal27)'
        required: true

concurrency:
  group: build-variant-${{ inputs.book }}-${{ inputs.variant }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install PyMuPDF
        run: pip install --quiet pymupdf

      - name: Build variant from book_chapter
        run: python3 .github/scripts/build-variant.py '${{ inputs.book }}' '${{ inputs.variant }}'

      - name: Commit & Push if Updated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # bare variantens egen mappe – jobben committer aldri noe den ikke har bygget selv
          git add "b/${{ inputs.book }}/${{ inputs.variant }}"

          if git diff --staged --quiet; then
            echo "No variant update."
            exit 0
          fi

          git commit -m "Build variant ${{ inputs.variant }} (${{ inputs.book }})"

          # Flere varianter bygges ofte samtidig, og sync-pdf.yml skriver til main.
          # Den som taper kappløpet rebaser på origin/main og prøver igjen, i stedet for å feile.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed (attempt $attempt)."
              exit 0
            fi
            echo "::warning::push avvist – rebaser på origin/main (attempt $attempt)"
            git fetch origin main
            git rebase origin/main
          done

          echo "::error::kunne ikke pushe til main etter 5 forsøk"
          exit 1

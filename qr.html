<!DOCTYPE html>
<style>
body{font:14px/1.5 system-ui,sans-serif;margin:1rem}
nav{display:flex;flex-wrap:wrap;gap:.7rem 1.2rem;align-items:flex-start;margin-bottom:1rem}
label{display:flex;flex-direction:column;gap:.2rem;font-size:12px;color:#666}
input,select{font:inherit}
input[type=text]{width:16ch}
input[type=number]{width:6ch}
select[size]{height:auto}
a{margin-left:auto}
#o canvas{width:min(80vmin,520px);background:#fff;image-rendering:pixelated}
#s{font:12px/1.6 ui-monospace,monospace;white-space:pre-wrap}
</style>
<nav id=f>
  <label>t (id | full url)<input id=t value=ldi spellcheck=false autocomplete=off></label>
  <label>img (art name | url)<input id=img value=ldi spellcheck=false autocomplete=off></label>
  <label>iSz<select id=iSz size=3 title="the sizes that exist"></select></label>
  <label>iTrans<input id=iTrans type=checkbox checked></label>
  <label>iHole<select id=iHole size=8 title="any whole number of modules; 0 = no hole; rec = qr.REC_HOLE"></select></label>
  <label>error %<input id=error type=number value=20 min=0 max=100></label>
  <a id=d download>png</a>
</nav>
<main>
  <div id=o></div>
  <p id=s></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="/i/u/qrmetrics.js?v=3"></script>
<script src=qr.js></script>
<script>
const F=document.getElementById('f'),O=document.getElementById('o'),S=document.getElementById('s'),D=document.getElementById('d')
,E={},K='LdD.qr';
['t','img','iSz','iTrans','iHole','error'].forEach(k=>E[k]=document.getElementById(k));
qr.GS.forEach(n=>E.iSz.append(new Option(n,n)));
let to=null,run=0;
const holes=()=>{const n=+E.iSz.value||21,keep=E.iHole.value;   // every hole the code has room for
  E.iHole.replaceChildren(new Option('rec',''));
  for(let h=0;h<n;h++)E.iHole.append(new Option(h,h));
  E.iHole.value=keep}
,args=tr=>[E.t.value.trim(),E.img.value.trim()||null,+E.iSz.value,tr==null?E.iTrans.checked:tr,E.iHole.value===''?null:+E.iHole.value,+E.error.value]
,val=()=>{const v={};['t','img','iSz','iTrans','iHole','error'].forEach(k=>v[k]=E[k].type==='checkbox'?E[k].checked:E[k].value);return v}
,save=()=>{try{localStorage.setItem(K,JSON.stringify(val()))}catch(e){}}   // storage blocked -> just do not remember
,load=()=>{let v;try{v=JSON.parse(localStorage.getItem(K)||'null')}catch(e){return}
  if(!v)return;
  if(v.iSz)E.iSz.value=v.iSz;      // the hole list depends on the size, so the size goes first
  holes();
  for(const k in v){if(k==='iSz'||!E[k])continue;if(E[k].type==='checkbox')E[k].checked=!!v[k];else E[k].value=v[k]}}
,show=cv=>{
  if(!cv){O.replaceChildren();S.textContent='nothing fits: no EC level holds that text at iSz';return null}
  O.replaceChildren(cv);
  D.href=cv.toDataURL();D.download=/^[A-Za-z0-9]+$/.test(E.t.value.trim())?E.t.value.trim()+'.'+cv.t+'.png':cv.t+'.png';
  const e=cv.e,p=Math.round(100*e.erased/e.ecPer);
  S.textContent=cv.t+'\n'+cv.u+'\nerases '+e.erased+'/'+e.ecPer+' EC cw \u00b7 '+p+'% error';
  return p}
,go=async()=>{           // iHole / iTrans / iSz / t / img typed: draw it, then report its error %
  holes();
  const k=++run,cv=await qr.g(...args());
  if(k!==run)return;
  const p=show(cv);
  if(p!=null)E.error.value=p;
  save()}
,fit=async()=>{          // error % typed: the biggest hole (and transparent) that stays within it
  const k=++run,lim=+E.error.value||0,v=E.t.value.trim(),A=E.img.value.trim()||null,sz=+E.iSz.value;
  for(const h of [...qr.HOLES].reverse())for(const tr of [true,false]){
    const cv=await qr.g(v,A,sz,tr,h,lim);
    if(k!==run)return;
    if(cv&&100*cv.e.erased/cv.e.ecPer<=lim){E.iHole.value=h;E.iTrans.checked=tr;show(cv);save();return}}
  save()}
,arm=fn=>()=>{clearTimeout(to);to=setTimeout(fn,300)};
['t','img','iSz','iHole','iTrans'].forEach(k=>{E[k].addEventListener('input',arm(go));E[k].addEventListener('change',arm(go))});
E.error.addEventListener('input',arm(fit));
E.error.addEventListener('change',arm(fit));
holes();
load();
go();
</script>

<html>
    <head>
        <script src="https://aigap.no/db.js?v=8"></script>
        <link rel="stylesheet" href="bu.css">
        <style>/* bu.css is missing */
            #buList{border-collapse:collapse}
            #buList td,#buList th{padding:.25em .8em;border-bottom:1px solid #ddd;text-align:left}
            #buList td:nth-child(2),#buList td:nth-child(3){text-align:right;font-variant-numeric:tabular-nums}
            #buList a{text-decoration:none}
        </style>
        <meta charset="utf-8">
        <title>Backup</title>
        <script>
            /* backup all tables in the database to CSV files, committed into this folder (bu/) on GitHub.
               needs a `cfg` row id=ghtoken — a GitHub token with repo write access. */
            const BU={repo:'gormb/www.aigap.no',branch:'main',dir:'bu',site:'https://aigap.no/',tables:['redir','log','codes','usage','books','book_versions','music','map']}/* cfg left out: it holds the token */
            const buUrl=t=>BU.site+BU.dir+'/'+t+'.csv'/* this page already lives in /bu/ — never use the repo path as a URL */
            const HDR=()=>({apikey:SUPABASE.publishableKey,Authorization:'Bearer '+SUPABASE.publishableKey})
              ,BSEP=';'/* list separator, fixed: never depend on the reader's locale */
              ,buMsg=m=>{const e=document.getElementById('buMsg');if(e)e.textContent=m}
              ,b64=t=>{const b=new TextEncoder().encode(t);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
              ,esc=v=>{if(v==null)return'';if(typeof v==='object')v=JSON.stringify(v);v=String(v);return v.includes(BSEP)||/[\t\n"]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
              ,buCSV=rows=>{const c=[...new Set(rows.flatMap(r=>Object.keys(r)))];return'\uFEFF'+c.join(BSEP)+'\n'+rows.map(r=>c.map(k=>esc(r[k])).join(BSEP)).join('\n')+'\n'}
            const buRows=async t=>{const out=[];for(let from=0;;from+=1000){const r=await fetch(`${SUPABASE.url}/rest/v1/${t}?select=*`,{headers:{...HDR(),'Range-Unit':'items',Range:`${from}-${from+999}`}});if(!r.ok)throw new Error(r.status+' '+await r.text());const rows=await r.json();out.push(...rows);if(rows.length<1000)return out}}
            const buTok=async()=>{const j=await(await fetch(`${SUPABASE.url}/rest/v1/cfg?select=val&id=eq.ghtoken`,{headers:HDR()})).json(),tok=j&&j[0]&&j[0].val;if(!tok)throw new Error('no cfg row ghtoken');return tok}
            const ghPut=async(p,text,tok,message)=>{const R=`https://api.github.com/repos/${BU.repo}/contents/${p}`,h={Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},g=await fetch(`${R}?ref=${BU.branch}`,{headers:h}),sha=g.ok?(await g.json()).sha:null,r=await fetch(R,{method:'PUT',headers:h,body:JSON.stringify({message,content:b64(text),branch:BU.branch,...sha&&{sha}})});if(!r.ok)throw new Error('github: '+((await r.json().catch(()=>({}))).message||r.status));return(await r.json()).content.sha}
            const buLive=async(p,n)=>{/* GitHub Pages needs ~1 min */const t0=Date.now();for(let i=0;i<24;i++){try{const r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(r.ok&&(await r.blob()).size===n)return Math.round((Date.now()-t0)/1000)}catch(e){}await new Promise(r=>setTimeout(r,5000))}return null}
            async function buTable(tableName){  /* one table -> bu/<table>.csv, onto github */
                buMsg(tableName+': reading…')
                try{
                    const rows=await buRows(tableName);if(!rows.length)return void buMsg(tableName+': empty — nothing written')
                    const csv=buCSV(rows),p=BU.dir+'/'+tableName+'.csv'
                    await ghPut(p,csv,await buTok(),'backup '+p)
                    const sec=await buLive(buUrl(tableName),new Blob([csv]).size)
                    await buFill(tableName)
                    buMsg(`${tableName}: ${rows.length} rows → ${p} — `+(sec!==null?`live after ${sec}s`:'pushed, not live yet (check the Pages build)'))
                    return rows.length
                }catch(e){buMsg(tableName+': '+e.message);return -1}
            }
            async function buTables(){  /* every table */
                buMsg('backing up '+BU.tables.length+' tables…')
                let ok=0
                for(const t of BU.tables){if(await buTable(t)>=0)ok++;await new Promise(r=>setTimeout(r,1000))}
                buMsg(`done: ${ok}/${BU.tables.length} tables backed up`)
            }
            const buFmt=n=>n>=1048576?(n/1048576).toFixed(2)+' MB':n>=1024?(n/1024).toFixed(1)+' kB':n+' B'
            const buCount=txt=>{/* data rows = newlines outside quotes, minus the header */let n=-1,q=false;for(let i=0;i<txt.length;i++){const c=txt[i];if(c==='"'){if(q&&txt[i+1]==='"')i++;else q=!q}else if(c==='\n'&&!q)n++}return Math.max(n,0)}
            const buMeta=async t=>{try{const r=await fetch(buUrl(t),{cache:'no-store'});if(!r.ok)return null;const txt=await r.text();return{rows:buCount(txt),size:new Blob([txt]).size,date:r.headers.get('last-modified')}}catch(e){return null}}
            const buFill=async t=>{const el=document.getElementById('buList'),tr=el&&el.querySelector(`tr[data-t="${t}"]`);if(!tr)return;const m=await buMeta(t),td=tr.children;td[1].textContent=m?m.rows.toLocaleString():'—';td[2].textContent=m?buFmt(m.size):'';td[3].textContent=m?(m.date?new Date(m.date).toLocaleString():'date not served'):'no backup yet';td[3].title=m&&m.date?m.date:'';td[4].innerHTML=`<button onclick="buTable('${t}')" title="backup ${t} → ${BU.dir}/${t}.csv">⤓</button> <button onclick="buView('${t}')" title="view ${t}.csv in the grid below">view</button>`+(m?` <a href="${buUrl(t)}">csv</a>`:'')}
            const buList=async()=>{const el=document.getElementById('buList');el.innerHTML='<tr><th>table</th><th>rows</th><th>size</th><th>backed up (date, time)</th><th></th></tr>'+BU.tables.map(t=>`<tr data-t="${t}"><td>${t}</td><td>…</td><td></td><td></td><td></td></tr>`).join('');for(const t of BU.tables)await buFill(t);buIdle()}
            /* ---- csv viewer: loads a backup into the iframe and shows a sortable grid ---- */
            const BU_CSS=`body{font:13px/1.45 system-ui,-apple-system,sans-serif;margin:10px;color:#222}
h3{margin:.1em 0 .6em;font-size:1em}
p.empty{color:#888}
table{border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:.2em .6em;border:1px solid #ddd;white-space:nowrap;max-width:30em;overflow:hidden;text-overflow:ellipsis}
th{position:sticky;top:0;background:#f6f6f6;cursor:pointer;text-align:left;user-select:none}
th:hover{background:#ececec}
th.sorted{background:#dbe7ff}
th.sorted:after{content:attr(data-dir);margin-left:.4em;color:#06c}
td.num{text-align:right}
tbody tr:nth-child(even) td{background:#fafafa}
tbody tr:hover td{background:#eef4ff}`
            const buSep=txt=>{/* which separator is this file using? look at the header line only */const n={',':0,';':0,'\t':0};let q=false,s=txt.replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(q&&s[i+1]==='"')i++;else q=!q}else if(!q){if(c==='\n')break;if(c in n)n[c]++}}const k=Object.keys(n).sort((a,b)=>n[b]-n[a])[0];return n[k]?k:';'}
            const buParse=txt=>{/* csv -> [header,...rows], handles quotes and embedded newlines */const S=buSep(txt),L=[];let f=[],c=[],q=false,s=txt.replace(/^\uFEFF/,'');for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch==='"'){if(s[i+1]==='"'){c.push('"');i++}else q=false}else c.push(ch)}else if(ch==='"')q=true;else if(ch===S){f.push(c.join(''));c=[]}else if(ch==='\n'){f.push(c.join(''));c=[];L.push(f);f=[]}else if(ch!=='\r')c.push(ch)}if(c.length||f.length){f.push(c.join(''));L.push(f)}return L}
            const buFrame=()=>{const fr=document.getElementById('buView'),d=fr.contentDocument;if(!d.head)d.documentElement.innerHTML='<head></head><body></body>';d.head.innerHTML='<style>'+BU_CSS+'</style>';d.body.innerHTML='';return{fr,d}}
            const buIdle=()=>{const{d}=buFrame();d.body.innerHTML='<p class="empty">Click “view” on a row to load that CSV here.</p>'}
            const buNum=v=>v!==''&&v!=null&&!isNaN(Number(v))
            async function buView(t){
                const{d}=buFrame(),say=m=>{d.body.innerHTML='<p class="empty">'+m+'</p>'}
                d.title=t+'.csv';say('loading '+t+'.csv…')
                let txt
                try{const r=await fetch(buUrl(t),{cache:'no-store'});if(!r.ok)return say('no backup yet — '+buUrl(t));txt=await r.text()}catch(e){return say('failed: '+e.message)}
                const L=buParse(txt),head=L[0]||[],rows=L.slice(1).filter(r=>r.some(v=>v!==''))
                const h=d.createElement('h3');h.textContent=`${t}.csv — ${rows.length.toLocaleString()} rows × ${head.length} columns`;d.body.appendChild(h)
                const tbl=d.createElement('table'),thead=d.createElement('thead'),thr=d.createElement('tr'),tb=d.createElement('tbody')
                tbl.append(thead,tb);thead.appendChild(thr)
                let sc=-1,sd=1
                const draw=()=>{
                    const v=sc<0?rows:rows.slice().sort((a,b)=>{const x=a[sc]||'',y=b[sc]||'';return(buNum(x)&&buNum(y)?Number(x)-Number(y):String(x).localeCompare(String(y)))*sd})
                    const frag=d.createDocumentFragment()
                    for(const r of v){const tr=d.createElement('tr');head.forEach((c,i)=>{const td=d.createElement('td'),val=r[i]==null?'':r[i];td.textContent=val;if(buNum(val))td.className='num';tr.appendChild(td)});frag.appendChild(tr)}
                    tb.textContent='';tb.appendChild(frag)
                }
                head.forEach((c,i)=>{const e=d.createElement('th');e.textContent=c;e.title='sort by '+c;e.onclick=()=>{sd=sc===i?-sd:1;sc=i;[...thr.children].forEach((x,j)=>{x.classList.toggle('sorted',j===sc);x.dataset.dir=sd>0?'▲':'▼'});draw()};thr.appendChild(e)})
                d.body.appendChild(tbl);draw()
            }
            addEventListener('DOMContentLoaded',buList)
        </script>
    </head>
    <body>
        <h1>Backup</h1>
        <h4>Database tables (PostgreSQL)</h4>
        <button onclick="buTables()">⤓ backup all tables</button> <button onclick="buList()">↻ refresh</button>
        <div id="buMsg"></div>
        <hr>
        <table id="buList"></table>
        <hr>
        <h4>View</h4>
        <iframe id="buView" height="560" style="width:100%;border:1px solid #ddd;background:#fff"></iframe>
    </body>
</html>

<!doctype html><meta charset=utf-8><title>Aigap</title>
<script src=db.js></script>
<script> // aigap.no ?<code> or /code resolve shortcode locally against the redir table and redirect
(function () {
  var p = new URLSearchParams(location.search);
  var key = p.keys().next().value;
  if (!key) { location.replace('h.html'); return; }
  var SUPA = window.SUPABASE;
  var H = { apikey: SUPA.publishableKey, 'Authorization': 'Bearer ' + SUPA.publishableKey };
  (async function () {
    try { if (window.logVisit) logVisit(key, location.href); } catch (e) {}
    var target = null;
    if (/^[A-Za-z0-9]+$/.test(key)) {
      try {
        var rows = await (await fetch(SUPA.url + '/rest/v1/redir?select=id,url&or=(id.eq.' + key + ',id.ilike.' + key + ')', { headers: H })).json();
        var exact = null, single = null;
        if (Array.isArray(rows)) {
          for (var i = 0; i < rows.length; i++) if (rows[i].id === key) exact = rows[i];
          single = rows.length === 1 ? rows[0] : null;
        }
        target = (exact || single || {}).url || null;
      } catch (e) {}
    }
    if (target) {
      p.delete(key);
      var s = p.toString();
      location.replace(target + (s ? (target.indexOf('?') >= 0 ? '&' : '?') + s : '') + (location.hash && target.indexOf('#') < 0 ? location.hash : ''));
    } else {
      location.replace('404.html');             // unknown code → 404
    }
  })();
})();
</script>

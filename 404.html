<!doctype html><meta charset=utf-8><body>
<script>(async ()=>{
slug=location.pathname.match(/^\/([A-Za-z0-9]+)\/?$/)?.[1]
,k='sb_publishable_H1UyOW06sr_Y6TkCai5OjQ_5rkdhfdO'
,ids=[slug,slug+'qr',slug+'qra'];
if (slug)try{
  r=await (await fetch('https://nlxtqmsghslwgbndxboe.supabase.co/rest/v1/redir?select=id,url&id=in.('+ids.join(',')+')',{headers:{apikey:k,'Authorization':'Bearer '+k}})).json();
  for (id of ids){
    row=r.find(x=> x.id===id);
    if (row?.url) return location.replace(row.url);
  }
}catch{}
document.title=document.body.innerHTML='404 – Not Found';
})();
</script></body></html>

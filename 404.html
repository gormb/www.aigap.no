<!doctype html><html lang=no><meta charset=utf-8>
<title>404 – Not Found</title>
<style>
  /* Hidden until we know there's no redirect → body only shows on a real 404. */
  body{font:16px system-ui;padding:3em;text-align:center;color:#333;visibility:hidden}
  body.off{visibility:visible}
  h1{margin:0 0 .3em}
</style>
<body id=b>
<h1>404 – Not Found</h1>
<p>Siden finnes ikke.</p>
<script>
(async () => {
  const show = () => document.body.classList.add('off'); // reveal fallback only here
  // Only single-segment, letters/digits slug → a plausible shortcode.
  // Stops it hijacking real files (/m.html, /r.js, /i/*.png) and multi-level paths.
  const segs = location.pathname.split('/').filter(Boolean);
  const slug = (segs.length === 1 && /^[A-Za-z0-9]+$/.test(segs[0])) ? segs[0] : '';
  if (!slug) return show();                // not a code → leave as a real 404

  const SUPA = { url: 'https://nlxtqmsghslwgbndxboe.supabase.co', key: 'sb_publishable_H1UyOW06sr_Y6TkCai5OjQ_5rkdhfdO' };
  const h = { apikey: SUPA.key, 'Authorization': 'Bearer ' + SUPA.key };
  // Resolve in the same order this repo does: exact → +qr → +qra
  for (const id of [slug, slug + 'qr', slug + 'qra']) {
    try {
      const r = await fetch(SUPA.url + '/rest/v1/redir?select=url&id=eq.' + encodeURIComponent(id), { headers: h });
      const row = (await r.json())[0];
      if (row && row.url) { location.replace(row.url); return; }  // → straight to target
    } catch (e) { return show(); }         // network/CORS error → fail closed (real 404)
  }
  show();                                  // not found in table → stay on the 404 page
})();
</script>
</body></html>
